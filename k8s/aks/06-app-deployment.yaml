apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudoku-game
  namespace: sudoku-game
  labels:
    app: sudoku-game
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sudoku-game
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sudoku-game
    spec:
      containers:
        - name: sudoku-game
          image: acrsudokugame.azurecr.io/sudoku-game:v2.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: sudoku-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sudoku-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
